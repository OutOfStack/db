name: "Release"

# Publishing a GitHub release builds its archives and checksums, verifies them and per-architecture images on native
# runners once CI passes on the tagged commit, and only then tags the image and uploads the archives. Release notes are
# maintained on GitHub; the workflow only attaches assets to the existing release.
on:
  release:
    types: [published]

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name }}
  IMAGE_NAME: ghcr.io/outofstack/db

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check release version and changelog
        shell: bash
        run: |
          number='(0|[1-9][0-9]*)'
          identifier="($number|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
          # Numeric identifiers cannot have leading zeroes; prerelease identifiers must be nonempty.
          pattern="^v$number\.$number\.$number(-$identifier(\.$identifier)*)?$"
          if [[ ! $TAG =~ $pattern ]]; then
            echo "Release tag must use valid SemVer vX.Y.Z or vX.Y.Z-prerelease (without build metadata)" >&2
            exit 1
          fi
          version=${TAG#v}
          base_version=${version%%-*}
          if ! awk -v version="[$version]" -v base_version="[$base_version]" '
            $1 == "##" && ($2 == version || $2 == base_version) { found = 1 }
            END { exit !found }
          ' CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $version or its base version $base_version" >&2
            exit 1
          fi

  ci:
    needs: validate
    uses: ./.github/workflows/main.yaml

  # Archives build while CI runs; nothing is pushed or published until both have passed.
  binaries:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Build archives and checksums once
        run: make dist VERSION="$TAG" COMMIT="$GITHUB_SHA"

      - uses: actions/upload-artifact@v7
        with:
          name: release-archives
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: [binaries, ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7

      # The black-box checks are Go tests in this checkout; they run against the downloaded archive's binaries.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - uses: actions/download-artifact@v8
        with:
          name: release-archives
          path: dist

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Digest-only pushes make the exact registry bytes available for testing without publishing release tags.
      - name: Build candidate image by digest
        id: candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ env.TAG }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}

      - name: Verify the archive and exact registry image on its native architecture
        env:
          DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          image="$IMAGE_NAME@$DIGEST"
          docker pull --platform "linux/$ARCH" "$image"
          test "$(docker image inspect --format '{{.Architecture}}' "$image")" = "$ARCH"
          VERSION="$TAG" IMAGE="$image" ./test/release/run.sh "dist/db_${TAG}_linux_${ARCH}.tar.gz"
          mkdir -p verified-digests
          printf '%s\n' "$DIGEST" > "verified-digests/$ARCH"

      - uses: actions/upload-artifact@v7
        with:
          name: verified-image-${{ matrix.arch }}
          path: verified-digests/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: release-archives
          path: dist

      - uses: actions/download-artifact@v8
        with:
          pattern: verified-image-*
          path: verified-digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # Prerelease images receive their own version only, never latest or X.Y.
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish manifest from verified digests without rebuilding
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          sources=()
          for arch in amd64 arm64; do
            digest=$(cat "verified-digests/$arch")
            [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
            sources+=("$IMAGE_NAME@$digest")
          done
          tags=()
          while IFS= read -r tag; do
            [[ -n $tag ]] && tags+=(--tag "$tag")
          done <<< "$IMAGE_TAGS"
          ((${#tags[@]} > 0))
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      - name: Upload the verified release archives
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          gh release upload "$TAG" dist/* --clobber
