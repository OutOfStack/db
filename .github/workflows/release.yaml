name: "Release"

# Publishing a GitHub release builds its archives, checksums and multi-arch image after CI passes on the tagged
# commit. Release notes are maintained on GitHub; the workflow only attaches assets to the existing release.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Check release version and changelog
        shell: bash
        run: |
          if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must use vX.Y.Z or vX.Y.Z-prerelease" >&2
            exit 1
          fi
          if ! awk -v version="[${TAG#v}]" '
            $1 == "##" && $2 == version { found = 1 }
            END { exit !found }
          ' CHANGELOG.md; then
            echo "CHANGELOG.md has no section for ${TAG#v}" >&2
            exit 1
          fi

  ci:
    needs: validate
    uses: ./.github/workflows/main.yaml

  binaries:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Build archives and checksums
        run: make dist VERSION="$TAG" COMMIT="$GITHUB_SHA"

      - name: Upload release assets
        run: gh release upload "$TAG" dist/* --clobber

  image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Build CLI
        run: make build-cli

      - uses: docker/setup-buildx-action@v4

      - name: Build image for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: db:smoke
          build-args: |
            VERSION=${{ env.TAG }}
            COMMIT=${{ github.sha }}
          cache-to: type=gha,mode=max

      - name: Container smoke test
        run: VERSION="$TAG" ./scripts/container-smoke.sh db:smoke

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # Pre-release tags (v1.0.0-rc.1) are published under their own version only, never as latest or X.Y.
          images: ghcr.io/outofstack/db
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.TAG }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
