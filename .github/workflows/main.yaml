name: "Test and build"

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these same checks against the tagged commit before it builds anything.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Verify Go dependencies
        run: go mod verify

      - name: Build
        run: go build -v ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Keep in step with GOLANGCI_LINT_VERSION in the Makefile.
          version: v2.14.0

      - name: Run tests
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Race detection
        run: go test -race ./...

  # A release verifies its real archives and registry images in its own verify job instead of these local builds.
  artifacts:
    if: github.event_name != 'release'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Build image
        run: docker build --build-arg VERSION=ci-verification --build-arg COMMIT="$GITHUB_SHA" -t db:smoke .

      - name: Verify native archive and container
        run: IMAGE=db:smoke make release-verify VERSION=ci-verification COMMIT="$GITHUB_SHA"
